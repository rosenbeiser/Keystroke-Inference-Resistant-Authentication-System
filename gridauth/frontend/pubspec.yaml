name: gridauth
description: 2D Grid-Based Authentication System — Flutter Android App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # HTTP client
  http: ^1.2.2
  # Secure key-value storage (Android Keystore backed)
  flutter_secure_storage: ^9.2.2
  # State management
  provider: ^6.1.2
  # Input formatting and validation
  flutter_form_builder: 11.0.0
  form_builder_validators: ^11.0.0
  # UI extras
  cupertino_icons: ^1.0.8
  loading_animation_widget: ^1.2.1
  animate_do: ^3.3.4
  google_fonts: ^6.2.1
  # JSON
  # (dart:convert is built-in)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/images/
